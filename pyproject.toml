[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scar-x"
version = "0.1.0"
description = "Falsifiable CPU-first spiking local-plasticity research prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "psutil>=5.9"]

[project.optional-dependencies]
test = ["pytest>=8"]
control = ["torch>=2"]
hermes-test = ["openai>=1", "PyYAML>=6"]
vision = ["Pillow>=10"]
training = ["scikit-learn>=1.4", "Pillow>=10"]

[project.scripts]
scarx = "scarx.interfaces.cli:main"
scarx-app = "scarx.app.generation_server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["scarx*"]

[tool.setuptools.package-data]
"scarx.app" = ["web/*.html", "web/*.css", "web/*.js", "generation_web/*.html", "generation_web/*.css", "generation_web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

