providers:
  scarx-local:
    name: SCAR-X — Thế hệ đầu
    api: http://127.0.0.1:8765/v1
    transport: chat_completions
    default_model: scarx-generation1
    interaction_mode: stateful_chat
    proactive_questions: true
    max_input_characters: 2048
    discover_models: false
    models:
      scarx-generation1:
        supports_vision: true
        supports_reasoning: false
        tool_calling: false
    capabilities:
      supports_vision: true
      supports_reasoning: false
      tool_calling: false
    extra_body:
      tool_choice: none
      scarx_question_surface: learning_tab
# Vision support ONLY8x8 handwritten digits, not screenshot/general VQA.
# Idle neural trace is on localhost website, not fabricated reasoning_content.
model_overrides:
  scarx-local:
    scarx-generation1:
      supports_tools: false
      supports_vision: true
      supports_reasoning: false
      context_window: 4096
      model_family: scarx
  custom:scarx-local:
    scarx-generation1:
      supports_tools: false
      supports_vision: true
      supports_reasoning: false
      context_window: 4096
      model_family: scarx
